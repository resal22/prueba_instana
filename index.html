
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Página de Pruebas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            margin-right: 10px;
            cursor: pointer;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #eee;
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1 id="titulo">Página de Pruebas Automatizadas</h1>
    <p id="subtitulo">HTML para pruebas Selenium / Java / JUnit</p>
</header>

<div class="container">

    <h2>Formulario de prueba</h2>

    <form id="formularioPrueba">

        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Ingrese su nombre">
        </div>

        <div class="form-group">
            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="correo@ejemplo.com">
        </div>

        <div class="form-group">
            <label for="opcion">Seleccione una opción</label>

            <select id="opcion" name="opcion">
                <option value="">-- Seleccione --</option>
                <option value="opcion1">Opción 1</option>
                <option value="opcion2">Opción 2</option>
                <option value="opcion3">Opción 3</option>
            </select>
        </div>

        <button
            type="button"
            id="btnEnviar"
            onclick="mostrarResultado()">
            Enviar
        </button>

        <button
            type="button"
            id="btnLimpiar"
            onclick="limpiarFormulario()">
            Limpiar
        </button>

    </form>

    <div id="resultado">
        <strong id="mensaje"></strong>
    </div>

    <hr>

    <h2>Elementos para pruebas</h2>

    <button id="btnAlerta" onclick="mostrarAlerta()">
        Mostrar alerta
    </button>

    <button id="btnConfirmacion" onclick="mostrarConfirmacion()">
        Mostrar confirmación
    </button>

    <button id="btnCambioTexto" onclick="cambiarTexto()">
        Cambiar texto
    </button>

    <p id="textoPrueba">
        Este texto puede ser modificado mediante Selenium.
    </p>

</div>

<script>

    function mostrarResultado() {

        const nombre = document.getElementById("nombre").value;
        const correo = document.getElementById("correo").value;
        const opcion = document.getElementById("opcion").value;

        const resultado = document.getElementById("resultado");
        const mensaje = document.getElementById("mensaje");

        if (nombre === "" || correo === "" || opcion === "") {

            mensaje.innerText =
                "Debe completar todos los campos.";

        } else {

            mensaje.innerText =
                "Formulario enviado correctamente. " +
                "Nombre: " + nombre +
                " | Correo: " + correo +
                " | Opción: " + opcion;
        }

        resultado.style.display = "block";
    }


    function limpiarFormulario() {

        document.getElementById("formularioPrueba").reset();

        document.getElementById("resultado").style.display = "none";
    }


    function mostrarAlerta() {

        alert("Esta es una alerta de prueba.");
    }


    function mostrarConfirmacion() {

        const respuesta =
            confirm("¿Desea continuar con la prueba?");

        if (respuesta) {
            alert("El usuario seleccionó ACEPTAR.");
        } else {
            alert("El usuario seleccionó CANCELAR.");
        }
    }


    function cambiarTexto() {

        document.getElementById("textoPrueba").innerText =
            "El texto fue cambiado correctamente mediante JavaScript.";
    }

</script>

</body>
</html>
